name: Build Hot Spot APK
on:
  push:
    branches: [main, selector-russian]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test, lint and build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace test lint assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Hot-Spot-RU.apk
          sha256sum dist/Hot-Spot-RU.apk | tee dist/SHA256SUMS.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging dist/Hot-Spot-RU.apk | head -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: Hot-Spot-RU-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
