name: Build Hot Spot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify and rename APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Hot-Spot.apk
          sha256sum dist/Hot-Spot.apk | tee dist/SHA256SUMS.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging dist/Hot-Spot.apk | head -n 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hot-Spot-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
