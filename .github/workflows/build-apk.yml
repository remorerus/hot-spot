name: Build Hot Spot APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack Android source
        run: |
          base64 --decode source-1.1.1-r2.b64 > source.zip
          unzip -q source.zip
          test -f android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Hot-Spot-1.1.1-r2.apk
          sha256sum dist/Hot-Spot-1.1.1-r2.apk | tee dist/SHA256SUMS.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging dist/Hot-Spot-1.1.1-r2.apk | head -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: Hot-Spot-APK-1.1.1-r2
          path: dist/
          if-no-files-found: error
          retention-days: 14
