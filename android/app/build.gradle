plugins { id 'com.android.application' }
android {
    namespace 'io.github.ksuzukigh.rokidwifiselector'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ksuzukigh.rokidwifiselector'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '1.1.0-ru-hotspot'
        testInstrumentationRunner 'android.app.InstrumentationTestRunner'
    }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { disable 'ExpiredTargetSdkVersion' }
}
dependencies { testImplementation 'junit:junit:4.13.2' }